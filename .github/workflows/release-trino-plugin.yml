name: Release Trino Connector Plugin

# Builds one Gravitino Trino connector package and publishes it as a GitHub Release
# asset, the same way apache/gravitino ships these tarballs on its releases.
on:
  workflow_dispatch:
    inputs:
      segment:
        description: 'Connector segment module (trino-connector-<segment>)'
        required: true
        default: 'trino-connector-482-483'
        type: string
      trino_version:
        description: 'Trino version to compile against (must be in the segment range)'
        required: true
        default: '483'
        type: string
      plugin_version:
        description: 'Version used in the artifact file name'
        required: true
        default: '2.0.0-trino483'
        type: string
      release_tag:
        description: 'GitHub release tag to create or update'
        required: true
        default: 'trino-483'
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-trino-plugin-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEGMENT: ${{ inputs.segment }}
      TRINO_VERSION: ${{ inputs.trino_version }}
      PLUGIN_VERSION: ${{ inputs.plugin_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle toolchain for Trino 473+)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up JDK 17 (runs Gradle itself)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Register JDKs with Gradle toolchain
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.paths=${{ steps.jdk25.outputs.path }},${{ steps.jdk17.outputs.path }}" >> ~/.gradle/gradle.properties

      - name: Free up disk space
        run: dev/ci/util_free_space.sh

      - name: Build connector package
        run: |
          ./gradlew ":trino-connector:${SEGMENT}:assembleTrinoConnector" \
            -PtrinoVersion="${TRINO_VERSION}" \
            -Pversion="${PLUGIN_VERSION}" \
            -PskipITs \
            -x test \
            --configure-on-demand \
            --console=plain

      - name: Prepare release assets
        id: assets
        run: |
          shopt -s nullglob
          files=(distribution/"gravitino-${SEGMENT}-${PLUGIN_VERSION}".tar.gz*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found in distribution/" >&2
            ls -l distribution >&2
            exit 1
          fi
          printf 'files=%s\n' "${files[*]}" >> "${GITHUB_OUTPUT}"
          ls -lh "${files[@]}"

      - name: Create or update GitHub release
        run: |
          read -r -a files <<< "${{ steps.assets.outputs.files }}"
          notes="Trino connector package for Trino ${TRINO_VERSION} (segment ${SEGMENT}).
          Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME} with:
          \`\`\`
          ./gradlew :trino-connector:${SEGMENT}:assembleTrinoConnector -PtrinoVersion=${TRINO_VERSION} -Pversion=${PLUGIN_VERSION} -x test
          \`\`\`
          Install: unpack, rename the directory to \`gravitino\`, and copy it into \`<trino-server>/plugin\`."
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
          else
            args=("${files[@]}" --title "Gravitino Trino connector for Trino ${TRINO_VERSION}" --notes "${notes}" --target "${GITHUB_SHA}")
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              args+=(--prerelease)
            fi
            gh release create "${RELEASE_TAG}" "${args[@]}"
          fi
